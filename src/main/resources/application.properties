spring.application.name=api-minimarket
# ==========================================
# DATABASE
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/minimarket_db
spring.datasource.username=root
spring.datasource.password=gabriel2017
# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

# Formatear SQL
spring.jpa.properties.hibernate.format_sql=true

# Mostrar parámetros de las consultas
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==========================================
# LOGGING
# ==========================================

logging.level.org.hibernate.SQL=DEBUG

# ==========================================
# SERVER
# ==========================================
server.port=8081

# Configuración JWT
security.jwt.secret-key=${JWT_SECRET_KEY:}
security.jwt.expiration=${JWT_EXPIRATION:}